<div class="page">
  <button class="back-btn" (click)="goBack()">&#8592; Back to list</button>

  <div class="loading" *ngIf="loading()">
    <div class="spinner"></div>
    <p>Loading…</p>
  </div>

  <div class="error" *ngIf="error()">
    <p>{{ error() }}</p>
    <button (click)="goBack()">Go back</button>
  </div>

  <div class="card" *ngIf="pokemon() as p">
    <div class="card-header">
      <img class="sprite"
           [src]="p.sprites.front_default"
           [alt]="p.name"
           *ngIf="p.sprites.front_default" />
      <div class="card-title">
        <span class="id">#{{ p.id }}</span>
        <h1>{{ p.name }}</h1>
        <div class="types">
          <span *ngFor="let t of p.types"
                class="type-badge"
                [style.background]="typeColor(t.type.name)">
            {{ t.type.name }}
          </span>
        </div>
      </div>
    </div>

    <div class="card-body">
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Height</span>
          <span class="info-value">{{ p.height / 10 }} m</span>
        </div>
        <div class="info-item">
          <span class="info-label">Weight</span>
          <span class="info-value">{{ p.weight / 10 }} kg</span>
        </div>
        <div class="info-item">
          <span class="info-label">Base XP</span>
          <span class="info-value">{{ p.base_experience ?? '—' }}</span>
        </div>
      </div>

      <section class="section">
        <h2>Abilities</h2>
        <div class="abilities">
          <span *ngFor="let a of p.abilities"
                class="ability-badge"
                [class.hidden]="a.is_hidden">
            {{ a.ability.name }}
            <em *ngIf="a.is_hidden"> (hidden)</em>
          </span>
        </div>
      </section>

      <section class="section">
        <h2>Base Stats</h2>
        <div class="stats">
          <div *ngFor="let s of p.stats" class="stat-row">
            <span class="stat-name">{{ s.stat.name }}</span>
            <span class="stat-val">{{ s.base_stat }}</span>
            <div class="stat-bar-track">
              <div class="stat-bar-fill"
                   [style.width.%]="statPercent(s.base_stat)"
                   [style.background]="statColor(s.base_stat)">
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
