spring:
  application:
    name: poke
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      FAIL_ON_NULL_FOR_PRIMITIVES: false
      FAIL_ON_UNKNOWN_PROPERTIES: false

pokeapi:
  base-url: https://pokeapi.co

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# --- Konfiguracja nadpisywana przez Kubernetes (ConfigMap / Secret) ---
# Spring Boot mapuje zmienne środowiskowe automatycznie (relaxed binding):
#   APP_ENVIRONMENT      -> app.environment
#   APP_WELCOME_MESSAGE  -> app.welcome-message
#   APP_API_TOKEN        -> app.api-token
#   POKEAPI_BASE_URL     -> pokeapi.base-url
app:
  environment: local
  welcome-message: "Witaj w Pokédexie!"
  api-token: ""

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
