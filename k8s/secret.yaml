# =============================================================================
# Etap 4: Secret – dane WRAŻLIWE (hasła, tokeny, klucze).
#
# UWAGA: base64 to KODOWANIE, nie szyfrowanie!  echo c3VwZXI= | base64 -d
# Prawdziwych sekretów NIE commitujemy do repo – w praktyce:
#   kubectl create secret ... / Sealed Secrets / External Secrets Operator / Vault / SOPS
# Ten plik zawiera wyłącznie wartość demonstracyjną.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: poke-secret
  namespace: poke
  labels:
    app.kubernetes.io/name: poke
type: Opaque
# stringData – wpisujemy zwykły tekst, API server sam zakoduje go do base64 w "data"
stringData:
  APP_API_TOKEN: "pikachu-demo-token-123"
# równoważnie (zakodowane ręcznie: echo -n 'pikachu-demo-token-123' | base64):
# data:
#   APP_API_TOKEN: cGlrYWNodS1kZW1vLXRva2VuLTEyMw==
