# Etap 7: Middleware Traefika (CRD) – dodatkowe nagłówki bezpieczeństwa w odpowiedziach
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: poke
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    customResponseHeaders:
      X-Workshop: "pokedex-k8s"
