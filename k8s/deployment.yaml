# =============================================================================
# Etap 2: Deployment
# Deployment -> zarządza ReplicaSetem -> który utrzymuje N identycznych Podów.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poke
  namespace: poke
  labels:
    app.kubernetes.io/name: poke
spec:
  replicas: 2                       # ile kopii (Podów) ma działać
  revisionHistoryLimit: 5           # ile starych ReplicaSetów trzymać do rollbacku
  selector:
    matchLabels:                    # którymi Podami zarządza ten Deployment
      app.kubernetes.io/name: poke  # MUSI pasować do template.metadata.labels
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                   # max 1 Pod ponad "replicas" w trakcie aktualizacji
      maxUnavailable: 0             # nigdy nie schodzimy poniżej "replicas"
  template:                         # ---- szablon Poda ----
    metadata:
      labels:
        app.kubernetes.io/name: poke
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: poke
          image: poke:1.0.0
          # Obraz lokalny (zaimportowany do klastra) – nie próbuj pobierać z rejestru
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Zasoby: requests = gwarantowane (scheduler), limits = maksimum
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 512Mi
          # startupProbe – daje JVM czas na start (do 30 x 2s = 60s)
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # livenessProbe – gdy nie odpowiada -> kubelet RESTARTUJE kontener
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # readinessProbe – gdy nie gotowy -> Pod wypada z Service (brak ruchu)
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
